# Publica o jogo no navegador (PWA, pasta pwa/) e o APK no GitHub Pages.
# Para ativar: Settings > Pages > Source: "GitHub Actions".
name: Publicar PWA

on:
  push:
    branches: [main, claude/sharp-bardeen-h5fvw9]
    paths: ['pwa/**', 'HortaHostil.apk', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Colocar o APK junto do site (botão "Baixar app Android")
        run: cp HortaHostil.apk pwa/HortaHostil.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
      - id: deployment
        uses: actions/deploy-pages@v4
