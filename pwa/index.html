<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Horta Hostil</title>
  <meta name="description" content="Roguelite de arena estilo Brotato: legumes armados contra insetos invasores.">
  <meta property="og:title" content="Horta Hostil">
  <meta property="og:description" content="Os legumes contra-atacam! 30 legumes, multiplayer, Desafio do Dia e ranking online. Jogue no navegador ou no Android.">
  <meta property="og:image" content="https://mello13256.github.io/Projeto-apk-random/capa.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://mello13256.github.io/Projeto-apk-random/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1B2414">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Horta Hostil">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #121A0D; overflow: hidden; overscroll-behavior: none; }
    /* Respeita o "entalhe" (notch) e as barras do celular */
    body { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; outline: none; }
    /* Caixa para digitar o nome do ranking */
    #nameBox { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, 0.6); z-index: 10; padding: 16px; }
    #nameBox[hidden] { display: none; }
    #nameBox form { background: #2A2116; border: 3px solid #7A5A30; border-radius: 18px; padding: 22px; width: min(480px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box;
      font: 600 18px "Segoe UI", system-ui, Roboto, Arial, sans-serif; color: #E8F5D0; display: grid; gap: 12px; }
    #nameBox h2 { margin: 0; font-size: 24px; color: #FFD84A; }
    #nameBox input, #nameBox textarea, #nameBox select { font: inherit; font-size: 20px; padding: 9px 12px; border-radius: 10px; border: 2px solid #7A5A30; background: #1B2414; color: #fff; width: 100%; box-sizing: border-box; }
    #nameBox textarea { min-height: 110px; resize: vertical; font-size: 17px; }
    #nameBox input:focus, #nameBox textarea:focus, #nameBox select:focus { outline: 3px solid #FFD84A; }
    #formFields { display: grid; gap: 8px; }
    #formFields label { font-size: 16px; }
    #formFields .note { font-size: 14px; color: #B8CFA0; margin: 0; }
    #nameBox .btns { display: flex; gap: 10px; justify-content: flex-end; }
    #nameBox button { font: inherit; padding: 10px 18px; border-radius: 12px; border: 0; cursor: pointer; color: #fff; background: #5A5A5A; }
    #nameBox button[type=submit] { background: #4CAF50; }
    #nameBox button:focus-visible { outline: 3px solid #FFD84A; }
    #nameErr { margin: 0; color: #FF8080; min-height: 1.2em; font-size: 16px; }
    noscript { color: #fff; font: 20px sans-serif; position: absolute; inset: 0; display: grid; place-items: center; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Horta Hostil"></canvas>
  <div id="nameBox" hidden>
    <form id="nameForm" autocomplete="off">
      <h2 id="nameTitle">Horta Hostil</h2>
      <div id="formFields"></div>
      <p id="nameErr"></p>
      <div class="btns">
        <button type="button" id="nameCancel">Cancelar</button>
        <button type="submit" id="nameOk">OK</button>
      </div>
    </form>
  </div>
  <noscript>Ative o JavaScript para jogar Horta Hostil.</noscript>
  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/net.js"></script>
  <script src="js/ranking.js"></script>
  <script src="js/mp.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/art.js"></script>
  <script src="js/community.js"></script>
  <script src="js/meta.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
